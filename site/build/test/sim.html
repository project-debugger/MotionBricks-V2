<!doctype html>
<meta charset="utf-8">
<title>SOMA controller timing test</title>
<!-- Runs the real controller + SOMA model (worker) without rendering, drives a scripted input sequence and
     measures lurches, freezes, pose pops and input-to-motion response. ?model=balanced&extra=600&ctrl=new
     extra = milliseconds added to every generation (emulates a slower device). -->
<script type="module">
import * as M from '../../js/math3d.js';
import { bindLimits, headingFromHips } from '../../js/codec.js';
import { DEFAULTS } from '../../js/settings.js';

const q = new URLSearchParams(location.search);
const extra = +(q.get('extra') || 0), modelKey = q.get('model') || 'balanced', jitter = +(q.get('jitter') || 0);
const { Controller, Library } = await import(q.get('ctrl') === 'baseline' ? './controller_baseline.js' : '../../js/controller.js');
const BASE = new URL('../../', location.href).href;
const getJSON = async (p) => (await fetch(BASE + p)).json(), getBin = async (p) => (await fetch(BASE + p)).arrayBuffer();
const log = (m) => { (window.LOG ||= []).push(m); };

const [skel, lim, wmeta, wbin, models] = await Promise.all([getJSON('data/skeleton.json'), getJSON('data/joint_limits.json'),
  getJSON('data/windows.json'), getBin('data/windows.bin'), getJSON('models/models.json')]);
const sk = { names: skel.names, parents: skel.parents, reference: Float64Array.from(skel.reference.flat()) };
const lib = new Library(sk, wmeta, wbin), limits = bindLimits(lim, sk), J = sk.names.length;
const { ClipLibrary } = await import('../../js/library.js');
const [cmeta, cbin] = await Promise.all([getJSON('data/clips.json'), getBin('data/clips.bin')]);
const clips = q.get('ctrl') === 'baseline' || q.has('noclips') ? null : new ClipLibrary(sk, cmeta, cbin, limits);
const { TransitionBank } = await import('../../js/bank.js');
const { legIndices } = await import('../../js/library.js');
const [bmeta, bbin] = await Promise.all([getJSON('data/bank.json'), getBin('data/bank.bin')]);
const tb0 = performance.now();
const bank = q.get('ctrl') === 'baseline' || q.has('nobank') ? null : new TransitionBank(sk, bmeta, bbin, limits, legIndices(sk));
const bankMs = performance.now() - tb0;
const S = { ...DEFAULTS, model: modelKey, ...JSON.parse(q.get('settings') || '{}') };

const worker = new Worker(new URL('../../js/worker.js', import.meta.url), { type: 'module' });
let nextId = 1; const waiting = new Map(); let readyResolve; const ready = new Promise((r) => { readyResolve = r; });
const netTimes = [];
worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === 'ready') readyResolve(m);
  else if (m.type === 'result') {
    const w = waiting.get(m.id); waiting.delete(m.id);
    const frames = [], contacts = [];
    for (let i = 0; i < m.count; i++) { frames.push(m.frames.slice(i * J * 7, (i + 1) * J * 7)); contacts.push(Array.from(m.contacts.slice(i * 4, i * 4 + 4))); }
    netTimes.push(m.ms.total);
    const delay = extra + (jitter ? Math.random() * jitter : 0);
    setTimeout(() => w.resolve({ frames, contacts, tokens: m.tokens }), delay);
  } else if (m.type === 'error') { if (waiting.has(m.id)) { waiting.get(m.id).reject(new Error(m.error)); waiting.delete(m.id); } else log('load error ' + m.error); }
};
worker.postMessage({ type: 'load', base: BASE + 'models/', model: modelKey, info: models.models[modelKey], skeleton: sk, jointLimits: lim, threads: 1 });
const rinfo = await ready;
const generate = (req) => new Promise((resolve, reject) => { const id = nextId++; waiting.set(id, { resolve, reject }); worker.postMessage({ type: 'generate', id, ...req }); });
const ctrl = new Controller({ sk, lib, clips, bank, limits, settings: () => S, generate, actions: wmeta.actions });
ctrl.debugStages = true; let prevStages = null; const stageSpikes = [];
const PJ = ['LeftFoot', 'RightFoot', 'LeftHand', 'RightHand', 'RightArm', 'LeftLeg', 'Neck2', 'LeftToeBase', 'Spine2'].map((n) => [n, sk.names.indexOf(n)]), pj = {};

// scripted input: [start s, move dir (world x,z) or null, gait]
const SCRIPT = q.has('actions')
  ? [[0, null, 'run'], [1.5, null, 'run', 'jump'], [4, null, 'run', 'dodge'], [6.5, null, 'run', 'duck'], [9, [0, 1], 'run'], [10.5, [0, 1], 'run', 'jump'], [13, [0, 1], 'run', 'dodge'], [15.5, [0, 1], 'run', 'duck'], [18, null, 'run'], [19.5, null, 'end']]
  : [[0, null, 'run'], [2, [0, 1], 'run'], [6, [1, 0], 'run'], [9, [-1, 0], 'run'], [12, null, 'run'],
  [14, [0.7071, 0.7071], 'walk'], [17, [0, 1], 'sprint'], [19, null, 'run'], [21.5, null, 'end']];
let lastSeg = -1;
const cmdAt = (t) => { let c = SCRIPT[0]; for (const s of SCRIPT) if (t >= s[0]) c = s; return c; };
const gaitSpeed = { walk: S.walkSpeed, run: S.runSpeed, sprint: S.sprintSpeed };
const rec = [];
const iR = sk.names.indexOf('RightLeg'), iL = sk.names.indexOf('LeftLeg');
let prevPose = null, t0 = performance.now(), last = t0, clampedFrames = 0;
const updMs = []; let nanFrames = 0, firstNaN = null; const spikes = [], events = []; let lastGen = 0, lastInst = 0, lastLate = 0;
const JNAMES = ['Hips', 'Chest', 'LeftArm', 'LeftForeArm', 'LeftHand', 'RightArm', 'RightForeArm', 'RightHand', 'LeftFoot', 'RightFoot', 'Head'], jrec = [];
await new Promise((done) => {
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const t = (now - t0) / 1000, c = cmdAt(t);
    if (c[2] === 'end') { done(); return; }
    const segIdx = SCRIPT.indexOf(c);
    const cmd = { move: c[1] ? c[1].slice() : [0, 0], gait: c[2], action: c[3] && segIdx !== lastSeg ? c[3] : null };
    lastSeg = segIdx;
    const u0 = performance.now();
    const pose = ctrl.update(cmd, dt);
    updMs.push(performance.now() - u0);
    const atEnd = ctrl.time >= (ctrl.buffer.length - 1) / 30 - 1e-6;
    if (atEnd) clampedFrames++;
    const w = M.fk(pose, sk.parents);
    let maxRot = 0;
    for (let n = 0; n < pose.length; n++) if (!Number.isFinite(pose[n])) { nanFrames++; if (!firstNaN) firstNaN = { frame: rec.length, t: +t.toFixed(3), dt, joints: [...new Set(Array.from(pose).map((x, i) => (Number.isFinite(x) ? -1 : Math.floor(i / 7))).filter((j) => j >= 0))].map((j) => sk.names[j]).slice(0, 12), inert: ctrl.inert.ro.some((x) => !Number.isFinite(x)), look: [ctrl.look.x, ctrl.look.v, ctrl.look.heading], fing: Array.from(ctrl.fingers.x).slice(0, 3) }; break; }
    let maxJ = -1;
    if (prevPose && dt > 0) for (let j = 1; j < J; j++) { const w = M.vlen(M.qToScaledAxis(M.qmul(M.Q(pose, j), M.qconj(M.Q(prevPose, j))))) / Math.max(dt, 1 / 60); if (w > maxRot) { maxRot = w; maxJ = j; } }
    if (ctrl.stats.generations !== lastGen || ctrl.stats.instant !== lastInst || ctrl.stats.late !== lastLate) { events.push([+t.toFixed(2), ctrl.stats.instant !== lastInst ? 'instant:' + ctrl.stats.lastInstant : 'splice', ctrl.stats.late !== lastLate ? 'LATE' : '', ctrl.stats.discarded]); lastGen = ctrl.stats.generations; lastInst = ctrl.stats.instant; lastLate = ctrl.stats.late; }
    if (prevStages && maxRot > 30 && stageSpikes.length < 12) {
      const jn = maxJ, row = { t: +t.toFixed(2), joint: sk.names[jn] };
      for (const k of ['sample', 'inert', 'feet', 'limits', 'final']) row[k] = +(M.vlen(M.qToScaledAxis(M.qmul(M.Q(ctrl.lastStages[k], jn), M.qconj(M.Q(prevStages[k], jn))))) / Math.max(dt, 1 / 60)).toFixed(1);
      const pj = sk.parents[jn]; row.parentSample = +(M.vlen(M.qToScaledAxis(M.qmul(M.Q(ctrl.lastStages.sample, pj), M.qconj(M.Q(prevStages.sample, pj))))) / Math.max(dt, 1 / 60)).toFixed(1);
      row.parentLimits = +(M.vlen(M.qToScaledAxis(M.qmul(M.Q(ctrl.lastStages.limits, pj), M.qconj(M.Q(prevStages.limits, pj))))) / Math.max(dt, 1 / 60)).toFixed(1);
      stageSpikes.push(row);
    }
    if (prevStages) for (const [n, j] of PJ) for (const k of ['sample', 'final']) {
      const w = M.vlen(M.qToScaledAxis(M.qmul(M.Q(ctrl.lastStages[k], j), M.qconj(M.Q(prevStages[k], j))))) / Math.max(dt, 1 / 60);
      (pj[n + ':' + k] ||= []).push(w);
    }
    prevStages = ctrl.lastStages;
    if (maxRot > 30 && spikes.length < 40) spikes.push([+t.toFixed(2), sk.names[maxJ], +maxRot.toFixed(0), ctrl.stats.instant, ctrl.stats.generations]);
    prevPose = pose;
    rec.push({ t, dt, x: w[0], z: w[2], y: w[1], yaw: headingFromHips(M.P(w, iR), M.P(w, iL)), goal: c[1] ? [c[1][0] * gaitSpeed[c[2]], c[1][1] * gaitSpeed[c[2]]] : [0, 0], atEnd, maxRot });
    if (q.has('joints')) jrec.push(JNAMES.map((n) => { const j = sk.names.indexOf(n); return [w[j * 7], w[j * 7 + 1], w[j * 7 + 2]]; }).flat().map((v) => +v.toFixed(4)));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
});

// ---- metrics
const sm = 6; // smooth velocity over ~0.1 s
const vel = rec.map((r, i) => { const a = rec[Math.max(0, i - sm)]; const d = r.t - a.t || 1; return [(r.x - a.x) / d, (r.z - a.z) / d]; });
const speed = vel.map((v) => Math.hypot(v[0], v[1]));
let lurchT = 0, freezeT = 0, surgeT = 0;
rec.forEach((r, i) => {
  if (i < sm) return;
  const gs = Math.hypot(r.goal[0], r.goal[1]);
  if (speed[i] > 8) lurchT += r.dt;
  if (speed[i] > Math.max(gs, 1) * 1.45 + 0.6) surgeT += r.dt;
  if (r.atEnd) freezeT += r.dt;
});
// response: per scripted change, time until the motion matches the command
const resp = [];
for (let s = 1; s < SCRIPT.length - 1; s++) {
  const [ts, dir, gait] = SCRIPT[s], gs = dir ? gaitSpeed[gait] : 0;
  let hit = null;
  for (let i = 0; i < rec.length; i++) {
    const r = rec[i]; if (r.t < ts) continue; if (r.t > SCRIPT[s + 1][0]) break;
    const v = vel[i];
    if (!dir) { if (speed[i] < 0.5) { hit = r.t - ts; break; } }
    else {
      const along = v[0] * dir[0] + v[1] * dir[1];
      if (along > 0.5 * gs && along > 0.85 * speed[i]) { hit = r.t - ts; break; }
    }
  }
  // onset: first visible change toward the new command
  let onset = null, i0 = rec.findIndex((r) => r.t >= ts);
  const v0 = vel[Math.max(0, i0)], s0 = Math.hypot(v0[0], v0[1]);
  for (let i = i0; i >= 0 && i < rec.length; i++) {
    const r = rec[i]; if (r.t > SCRIPT[s + 1][0]) break;
    const v = vel[i], sp = Math.hypot(v[0], v[1]);
    let ok = false;
    if (!dir) ok = sp < s0 * 0.85 - 0.05;
    else if (s0 < 0.3) ok = sp > 0.3;
    else { const a0 = Math.atan2(v0[0], v0[1]), a = Math.atan2(v[0], v[1]), want = Math.atan2(dir[0], dir[1]);
      const d0 = Math.abs(Math.atan2(Math.sin(want - a0), Math.cos(want - a0))), d1 = Math.abs(Math.atan2(Math.sin(want - a), Math.cos(want - a)));
      ok = d0 - d1 > 0.17 || (d0 < 0.17 && Math.abs(sp - gs) < Math.abs(s0 - gs) - 0.3); }
    if (ok) { onset = r.t - ts; break; }
  }
  resp.push({ at: ts, to: dir ? `${gait} ${dir.map((x) => x.toFixed(1)).join(',')}` : 'stop', seconds: hit === null ? null : +hit.toFixed(2), onset: onset === null ? null : +onset.toFixed(2) });
}
const rots = rec.map((r) => r.maxRot).filter((x) => Number.isFinite(x)).sort((a, b) => a - b);
const pct = (a, p) => a[Math.min(a.length - 1, Math.floor(a.length * p))];
const nt = netTimes.slice().sort((a, b) => a - b);
window.RESULT = {
  ctrl: q.get('ctrl') || 'new', model: modelKey, extraMs: extra, jitterMs: jitter, threads: rinfo.threads,
  workerMsMedian: Math.round(pct(nt, 0.5)), generations: ctrl.stats.generations, late: ctrl.stats.late, failures: ctrl.stats.failures, instant: ctrl.stats.instant, discarded: ctrl.stats.discarded, bankMs: Math.round(bankMs), lastInstant: ctrl.stats.lastInstant, instantLog: ctrl.stats.instantLog, extended: ctrl.stats.extended, steeringDeg: Math.round((ctrl.stats.steering || 0) * 57.3),
  frames: rec.length, nanFrames, firstNaN, spikes, events, stageSpikes, seams: ctrl.stats.seams,
  perJoint: Object.fromEntries(Object.entries(pj).map(([k, v]) => { const a = v.slice().sort((x, y) => x - y); return [k, [+a[Math.floor(a.length * 0.99)].toFixed(1), +a[a.length - 1].toFixed(1)]]; })), rotNaN: rec.filter((r) => !Number.isFinite(r.maxRot)).length, freezeSeconds: +freezeT.toFixed(2), lurchSeconds: +lurchT.toFixed(2), surgeSeconds: +surgeT.toFixed(2),
  maxSpeed: +Math.max(...speed.slice(sm)).toFixed(2), jointRadPerSecP99: +pct(rots, 0.99).toFixed(1), jointRadPerSecMax: +rots[rots.length - 1].toFixed(1),
  updateMsP50: +pct(updMs.slice().sort((a, b) => a - b), 0.5).toFixed(2), updateMsP99: +pct(updMs.slice().sort((a, b) => a - b), 0.99).toFixed(2),
  responseSeconds: resp, joints: q.has('joints') ? { names: JNAMES, t: rec.map((r) => +r.t.toFixed(3)), w: jrec } : undefined, trace: q.has('trace') ? rec.map((r, i) => [+r.t.toFixed(3), +r.x.toFixed(3), +r.z.toFixed(3), +speed[i].toFixed(2), r.atEnd ? 1 : 0]) : undefined,
};
</script>

<!doctype html>
<meta charset="utf-8">
<title>Bind pose check</title>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.min.js" } }</script>
<!-- How undeformed each model's reference pose is: skinned edge length / raw (bind) edge length over a sample of mesh
     edges; spread = p95/p5 of that ratio (1.00 = exactly the bind pose). Compares the file's node pose with the
     reference pose AnimalModel uses (bind pose rebuilt from the inverse bind matrices). -->
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/three/addons/loaders/GLTFLoader.js';
import { ANIMAL_MODELS, AnimalModel } from '../../js/animalmesh.js';
const BASE = new URL('../../', location.href).href, out = {};
function spread(root) {
  root.updateMatrixWorld(true);
  const r = [], a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), d = new THREE.Vector3(); let seed = 3;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  root.traverse((o) => { if (!o.isSkinnedMesh) return; const g = o.geometry, idx = g.index, pos = g.attributes.position, n = idx ? idx.count / 3 : pos.count / 3;
    for (let t = 0; t < Math.min(n, 2500); t++) { const tri = Math.floor(rnd() * n), i = idx ? idx.getX(tri * 3) : tri * 3, j = idx ? idx.getX(tri * 3 + 1) : tri * 3 + 1;
      o.getVertexPosition(i, a).applyMatrix4(o.matrixWorld); o.getVertexPosition(j, b).applyMatrix4(o.matrixWorld);
      c.fromBufferAttribute(pos, i); d.fromBufferAttribute(pos, j); const raw = c.distanceTo(d); if (raw > 1e-9) r.push(a.distanceTo(b) / raw); } });
  r.sort((x, y) => x - y); return +(r[Math.floor(r.length * 0.95)] / r[Math.floor(r.length * 0.05)]).toFixed(3);
}
for (const key of Object.keys(ANIMAL_MODELS)) {
  const buf = await fetch(BASE + `data/animal/models/${ANIMAL_MODELS[key].file}`).then((x) => x.arrayBuffer());
  const g1 = await new GLTFLoader().parseAsync(buf.slice(0), ''), filePose = spread(g1.scene);
  const g2 = await new GLTFLoader().parseAsync(buf.slice(0), ''), m = new AnimalModel(THREE, g2, ANIMAL_MODELS[key]);
  const P = (o) => m.restP.get(o), legs = [m.front.L, m.front.R, m.hind.L, m.hind.R].map((l) => l.tip0.clone().sub(P(l.bones.find(Boolean))).normalize());
  const down = legs.reduce((a, v) => a.add(v), new THREE.Vector3()).normalize(), sp = P(m.neck[0]).clone().sub(P(m.pelvis)).normalize();
  out[key] = { filePose, reference: spread(m.group), jointsChanged: m.bindJoints, legsFromDown: +(down.angleTo(new THREE.Vector3(0, -1, 0)) * 57.3).toFixed(1),
    spinePitch: +(Math.asin(sp.y) * 57.3).toFixed(1), spineYaw: +(Math.atan2(sp.x, sp.z) * 57.3).toFixed(1), tipsY: legs.length, pelvisY: +P(m.pelvis).y.toFixed(3), hips: m.hips };
}
window.RESULT = out;
</script>

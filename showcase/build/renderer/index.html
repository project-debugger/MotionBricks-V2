<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SOMA renderer</title>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #dfe5ec;
               font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
  canvas { position: absolute; left: 0; top: 0; }
  .tile { position: absolute; box-sizing: border-box; pointer-events: none; }
  .tile.sep { border-left: 3px solid rgba(20, 28, 38, 0.85); }
  .tile.sepTop { border-top: 3px solid rgba(20, 28, 38, 0.85); }
  .label { position: absolute; left: 22px; top: 18px; color: #fff; background: rgba(18, 26, 36, 0.78);
           padding: 10px 16px 9px; border-radius: 10px; }
  .label b { display: block; font-size: 30px; letter-spacing: 0.2px; }
  .label span { display: block; font-size: 19px; opacity: 0.86; margin-top: 3px; }
  .small .label b { font-size: 24px; } .small .label span { font-size: 16px; }
  .caption { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; }
  .caption div { display: inline-block; font-size: 40px; font-weight: bold; color: #fff;
                 background: rgba(214, 92, 36, 0.92); padding: 8px 24px; border-radius: 12px; }
  .small .caption div { font-size: 28px; padding: 6px 16px; }
  .speed { position: absolute; right: 22px; top: 18px; color: #fff; background: rgba(18, 26, 36, 0.78);
           padding: 8px 14px; border-radius: 10px; font-size: 24px; font-variant-numeric: tabular-nums; }
  .small .speed { font-size: 18px; }
  .titled .label, .titled .speed { top: 58px; }
  #title { position: absolute; left: 50%; transform: translateX(-50%); top: 0; color: #fff;
           background: rgba(18, 26, 36, 0.85); padding: 8px 22px; border-radius: 0 0 12px 12px;
           font-size: 22px; font-weight: bold; white-space: nowrap; }
  #mark { position: absolute; right: 16px; bottom: 10px; color: rgba(20, 28, 38, 0.75); font-size: 16px; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="overlay"></div>
<script type="module" src="./app.js"></script>
</body>
</html>

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "somart"
version = "0.1.0"
description = "Optimized, configurable CPU/GPU runtime and animation controller for NVIDIA MotionBricks SOMA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "onnxruntime>=1.20", "pyyaml>=6.0"]

[project.optional-dependencies]
export = ["onnx==1.23.2", "onnx-ir>=1.1", "safetensors==0.8.0", "torch==2.14.0", "requests>=2.31"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
